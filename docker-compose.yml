services:
  sonar:
    image: sonarqube
    ports:
      - "9000:9000"
  sonar-scan:
    image: sonarsource/sonar-scanner-cli
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN
    volumes:
      - ".:/usr/src"
    links:
      - "sonar:sonarqube"
    command:
      - -Dsonar.projectKey=sonarcloud-actions_sonarcloud-check-status-action
