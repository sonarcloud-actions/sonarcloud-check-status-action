name: 'Sonarcloud Check Status Action'
description: 'Checks the status of a SonarCloud project'
branding:
  icon: cloud
  color: orange
inputs:
  url:
    description: 'url of sonarcloud'
    required: false
    default: 'https://sonarcloud.io'
  org:
    description: 'Github Organization'
    required: false
  repo:
    description: 'Github Repo'
    required: false
  branch:
    description: 'Branch to check status. Defaults the current ref.'
    required: false
  wait-timeout:
    description: 'Seconds to keep polling while SonarCloud is still processing the analysis of the commit or its quality gate.'
    required: false
    default: '300'
  poll-interval:
    description: 'Seconds between polls while waiting for the analysis or the quality gate status.'
    required: false
    default: '10'
  commit:
    description: 'Commit whose analysis to wait for before checking the quality gate. Defaults to the commit being built, or none when branch names another branch.'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'
