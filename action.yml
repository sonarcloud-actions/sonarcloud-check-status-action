name: 'Sonarcloud Check Status Action'
description: 'Checks the status of a SonarCloud project'
branding:
  icon: cloud
  color: orange
inputs:
  url:
    description: 'url of sonarcloud'
    required: false
    default: 'https://sonarcloud.io'
  org:
    description: 'Github Organization'
    required: false
  repo:
    description: 'Github Repo'
    required: false
  branch:
    description: 'Branch to check status. Defaults the current ref.'
    required: false
  wait-timeout:
    description: 'Seconds to keep polling while the quality gate status is NONE (analysis still processing).'
    required: false
    default: '300'
  poll-interval:
    description: 'Seconds between polls while waiting for the quality gate status.'
    required: false
    default: '10'
runs:
  using: 'node24'
  main: 'dist/index.js'
